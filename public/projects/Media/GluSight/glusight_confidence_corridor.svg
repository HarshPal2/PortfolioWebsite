<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" fill="none">
  <!-- Background Card -->
  <rect width="800" height="480" rx="16" fill="#FAFAF8" stroke="#EBE9E1" stroke-width="1.5"/>
  
  <!-- Grid Lines -->
  <line x1="80" y1="100" x2="740" y2="100" stroke="#E5E3DC" stroke-dasharray="4 4" stroke-width="1"/>
  <line x1="80" y1="180" x2="740" y2="180" stroke="#E5E3DC" stroke-dasharray="4 4" stroke-width="1"/>
  <line x1="80" y1="260" x2="740" y2="260" stroke="#E5E3DC" stroke-dasharray="4 4" stroke-width="1"/>
  <line x1="80" y1="340" x2="740" y2="340" stroke="#E5E3DC" stroke-dasharray="4 4" stroke-width="1"/>

  <!-- Axis Labels -->
  <text x="65" y="105" font-family="'Inter', -apple-system, sans-serif" font-size="12" fill="#8E8C84" text-anchor="end" font-weight="500">240</text>
  <text x="65" y="185" font-family="'Inter', -apple-system, sans-serif" font-size="12" fill="#8E8C84" text-anchor="end" font-weight="500">180</text>
  <text x="65" y="265" font-family="'Inter', -apple-system, sans-serif" font-size="12" fill="#8E8C84" text-anchor="end" font-weight="500">120</text>
  <text x="65" y="345" font-family="'Inter', -apple-system, sans-serif" font-size="12" fill="#8E8C84" text-anchor="end" font-weight="500">70</text>
  <text x="65" y="365" font-family="'Inter', -apple-system, sans-serif" font-size="10" fill="#A8A69E" text-anchor="end">mg/dL</text>

  <!-- Target Glucose Range Shading (70 - 140 mg/dL) -->
  <rect x="80" y="230" width="660" height="110" fill="#10B981" fill-opacity="0.06" rx="4"/>
  <text x="730" y="248" font-family="'Inter', -apple-system, sans-serif" font-size="11" fill="#059669" text-anchor="end" font-weight="600">Target Zone (70–140 mg/dL)</text>

  <!-- Time Horizon Labels -->
  <text x="160" y="420" font-family="'Inter', -apple-system, sans-serif" font-size="12" fill="#8E8C84" text-anchor="middle">-2h</text>
  <text x="280" y="420" font-family="'Inter', -apple-system, sans-serif" font-size="12" fill="#8E8C84" text-anchor="middle">-1h</text>
  <text x="400" y="420" font-family="'Inter', -apple-system, sans-serif" font-size="13" fill="#111111" font-weight="700" text-anchor="middle">NOW</text>
  <text x="550" y="420" font-family="'Inter', -apple-system, sans-serif" font-size="12" fill="#FF7A18" font-weight="600" text-anchor="middle">+1h Forecast</text>
  <text x="700" y="420" font-family="'Inter', -apple-system, sans-serif" font-size="12" fill="#FF7A18" font-weight="600" text-anchor="middle">+2h Horizon</text>

  <!-- Gradients -->
  <defs>
    <linearGradient id="corridorGradient" x1="400" y1="270" x2="720" y2="235" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF7A18" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#FF9E4A" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFB27D" stop-opacity="0.06"/>
    </linearGradient>
  </defs>

  <!-- Uncertainty Corridor / Fan of Confidence -->
  <path d="M 400 270 C 460 250, 520 210, 580 180 C 630 155, 670 140, 720 135 L 720 335 C 670 325, 630 310, 580 295 C 520 280, 460 275, 400 270 Z" 
        fill="url(#corridorGradient)" />

  <!-- Upper Confidence Boundary Line -->
  <path d="M 400 270 C 460 250, 520 210, 580 180 C 630 155, 670 140, 720 135" 
        stroke="#FF7A18" stroke-width="1.8" stroke-dasharray="4 4" stroke-opacity="0.8"/>
  <text x="725" y="139" font-family="'Inter', -apple-system, sans-serif" font-size="10" fill="#FF7A18" font-weight="600">Upper Estimate</text>

  <!-- Lower Confidence Boundary Line -->
  <path d="M 400 270 C 460 275, 520 280, 580 295 C 630 310, 670 325, 720 335" 
        stroke="#0F766E" stroke-width="1.8" stroke-dasharray="4 4" stroke-opacity="0.7"/>
  <text x="725" y="339" font-family="'Inter', -apple-system, sans-serif" font-size="10" fill="#0F766E" font-weight="600">Lower Estimate</text>

  <!-- Most Likely Predictive Trajectory (Central Dashed Line) -->
  <path d="M 400 270 C 460 260, 520 245, 580 230 C 630 218, 670 210, 720 205" 
        stroke="#FF7A18" stroke-width="3" stroke-dasharray="6 4"/>
  <circle cx="720" cy="205" r="5" fill="#FF7A18" stroke="#FFFFFF" stroke-width="2"/>

  <!-- Historical Telemetry Curve (Solid Teal Line) -->
  <path d="M 100 295 Q 150 240, 200 250 T 280 230 T 340 280 L 400 270" 
        stroke="#0F766E" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Historical Telemetry Points -->
  <circle cx="100" cy="295" r="4" fill="#0F766E"/>
  <circle cx="200" cy="250" r="4" fill="#0F766E"/>
  <circle cx="280" cy="230" r="4" fill="#0F766E"/>
  <circle cx="340" cy="280" r="4" fill="#0F766E"/>

  <!-- Vertical Timeline 'NOW' divider -->
  <line x1="400" y1="75" x2="400" y2="395" stroke="#0F766E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="365" y="48" width="70" height="22" rx="11" fill="#0F766E"/>
  <text x="400" y="63" font-family="'Inter', -apple-system, sans-serif" font-size="10" fill="#FFFFFF" font-weight="700" letter-spacing="0.05em" text-anchor="middle">PRESENT</text>
  
  <!-- Current Value Node ('NOW') -->
  <circle cx="400" cy="270" r="8" fill="#FF7A18" stroke="#FFFFFF" stroke-width="3"/>
  <rect x="365" y="215" width="70" height="30" rx="6" fill="#111111"/>
  <text x="400" y="235" font-family="'Inter', -apple-system, sans-serif" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">110</text>
  <polygon points="395,245 405,245 400,250" fill="#111111"/>

  <!-- Callouts -->
  <g transform="translate(100, 130)">
    <rect width="180" height="48" rx="6" fill="#FFFFFF" stroke="#E5E3DC" stroke-width="1"/>
    <text x="12" y="20" font-family="'Inter', -apple-system, sans-serif" font-size="10" font-weight="700" fill="#0F766E" letter-spacing="0.08em">MEASURED DATA</text>
    <text x="12" y="36" font-family="'Inter', -apple-system, sans-serif" font-size="11" fill="#555555">Continuous past readings</text>
  </g>

  <g transform="translate(510, 70)">
    <rect width="210" height="48" rx="6" fill="#FFFFFF" stroke="#E5E3DC" stroke-width="1"/>
    <text x="12" y="20" font-family="'Inter', -apple-system, sans-serif" font-size="10" font-weight="700" fill="#FF7A18" letter-spacing="0.08em">PROBABILISTIC HORIZON</text>
    <text x="12" y="36" font-family="'Inter', -apple-system, sans-serif" font-size="11" fill="#555555">Confidence corridor expands</text>
  </g>
</svg>